name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # Unit and Integration Tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test -- --coverage --ci --watchAll=false
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://testuser:testpass@localhost:27017/shopvalue_test?authSource=admin
          CLERK_SECRET_KEY: sk_test_mock_key_for_testing
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock_key_for_testing
          CLERK_WEBHOOK_SECRET: whsec_mock_webhook_secret_for_testing
          STRIPE_SECRET_KEY: sk_test_mock_stripe_key_for_testing
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_mock_stripe_key_for_testing
          STRIPE_WEBHOOK_SECRET: whsec_mock_stripe_webhook_for_testing
          UPSTASH_REDIS_REST_URL: https://mock-redis-url.upstash.io
          UPSTASH_REDIS_REST_TOKEN: mock_redis_token_for_testing
          RESEND_API_KEY: re_mock_resend_key_for_testing
          AMPLITUDE_API_KEY: mock_amplitude_key_for_testing
          NEXT_PUBLIC_AMPLITUDE_API_KEY: mock_amplitude_public_key
          NEXTAUTH_SECRET: mock_nextauth_secret_for_testing
          ENCRYPTION_KEY: mock_encryption_key_for_testing_32_chars
          ENABLE_NOTIFICATIONS: false
          ENABLE_ANALYTICS: false
          ENABLE_REAL_PAYMENTS: false

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Coverage Gate (80%)
        run: |
          COVERAGE=$(grep -o '"percentage":[0-9.]*' coverage/coverage-summary.json | head -1 | cut -d':' -f2)
          echo "Test coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Test coverage ($COVERAGE%) is below the required 80% threshold"
            exit 1
          else
            echo "✅ Test coverage ($COVERAGE%) meets the 80% requirement"
          fi

  # E2E Tests with Playwright
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock_key_for_testing
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_mock_stripe_key_for_testing
          NEXT_PUBLIC_AMPLITUDE_API_KEY: mock_amplitude_public_key

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          CLERK_SECRET_KEY: sk_test_mock_key_for_testing
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock_key_for_testing
          CLERK_WEBHOOK_SECRET: whsec_mock_webhook_secret_for_testing
          STRIPE_SECRET_KEY: sk_test_mock_stripe_key_for_testing
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_mock_stripe_key_for_testing
          STRIPE_WEBHOOK_SECRET: whsec_mock_stripe_webhook_for_testing
          UPSTASH_REDIS_REST_URL: https://mock-redis-url.upstash.io
          UPSTASH_REDIS_REST_TOKEN: mock_redis_token_for_testing
          RESEND_API_KEY: re_mock_resend_key_for_testing
          AMPLITUDE_API_KEY: mock_amplitude_key_for_testing
          NEXT_PUBLIC_AMPLITUDE_API_KEY: mock_amplitude_public_key
          NEXTAUTH_SECRET: mock_nextauth_secret_for_testing
          ENCRYPTION_KEY: mock_encryption_key_for_testing_32_chars
          ENABLE_NOTIFICATIONS: false
          ENABLE_ANALYTICS: false
          ENABLE_REAL_PAYMENTS: false

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Security & Quality Checks
  security:
    name: Security & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high

      - name: Check for vulnerabilities
        run: npx audit-ci --config .audit-ci.json || true

  # Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock_key_for_testing
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_mock_stripe_key_for_testing
          NEXT_PUBLIC_AMPLITUDE_API_KEY: mock_amplitude_public_key

      - name: Check build output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed: .next directory not found"
            exit 1
          fi
          echo "✅ Build successful"

  # Deployment (only on main branch)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, e2e-tests, security, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: https://shopvalue.vercel.app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}

  # Notify on completion
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, e2e-tests, security, build]
    if: always()
    
    steps:
      - name: Check results and notify
        run: |
          if [[ "${{ needs.test.result }}" == "success" && 
                "${{ needs.e2e-tests.result }}" == "success" && 
                "${{ needs.security.result }}" == "success" && 
                "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All tests passed! Pipeline successful."
          else
            echo "❌ Some tests failed. Check the logs above."
            exit 1
          fi